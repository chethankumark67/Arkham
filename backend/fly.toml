# fly.toml app configuration file generated for arkham-api on 2026-11-06T07:06:35+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'arkham-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  WEB_CONCURRENCY = '1'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
