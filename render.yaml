# Render blueprint (alternative to Fly): connect the GitHub repo in the Render dashboard -> "New Blueprint".
services:
  - type: web
    name: arkham-api
    runtime: docker
    rootDir: backend
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: arkham-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: arkham-cache, property: connectionString }
  - type: keyvalue
    name: arkham-cache
    plan: free
    ipAllowList: []
databases:
  - name: arkham-db
    plan: basic-256mb
