# Full stack locally:  docker compose up --build   ->  web http://localhost:8080, api http://localhost:8000/docs
services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64   # official image is amd64-only; emulated on Apple Silicon
    environment: { POSTGRES_USER: arkham, POSTGRES_PASSWORD: arkham, POSTGRES_DB: arkham }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U arkham"], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://arkham:arkham@db:5432/arkham
      REDIS_URL: redis://redis:6379/0
    ports: ["${API_PORT:-8000}:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  web:
    build: { context: ./frontend, args: { VITE_API_URL: "http://localhost:8000" } }
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  pgdata:
